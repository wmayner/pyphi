name: Build

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for proper versioning

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.13

      - name: Build package
        run: uv build

      - name: Check distribution
        run: uvx twine check dist/*

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  test-install:
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.13

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Create venv and install wheel
        shell: bash
        run: |
          uv venv
          uv pip install dist/*.whl

      - name: Test import
        shell: bash
        # A bare `import pyphi` succeeds even on a wheel with no .py files
        # (pyphi/data/ installs as a PEP 420 namespace package), so assert
        # real source is present and a public symbol resolves.
        run: |
          if [ -f ".venv/bin/python" ]; then
            PY=".venv/bin/python"
          else
            PY=".venv/Scripts/python"
          fi
          "$PY" -c "
          import pyphi
          assert pyphi.__file__ is not None, 'installed as a namespace package: wheel has no source'
          pyphi.analyze
          import pyphi.examples
          pyphi.examples.basic_substrate()
          print('PyPhi imported successfully')
          "
